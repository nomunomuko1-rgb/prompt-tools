<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>はてなブログ用 お題コピペボックス ジェネレーター</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    background: #12101a;
    color: #e0dce8;
    min-height: 100vh;
}
header {
    text-align: center;
    padding: 28px 20px 16px;
    border-bottom: 1px solid rgba(139,92,246,0.25);
    background: rgba(139,92,246,0.04);
}
header h1 { font-size: 1.35em; color: #c4b5fd; letter-spacing: 0.03em; }
header p { font-size: 0.78em; color: #7c7491; margin-top: 6px; }
.app { display: flex; gap: 0; min-height: calc(100vh - 110px); }
.panel { flex: 1; padding: 24px 22px; }
.panel-left { max-width: 460px; border-right: 1px solid rgba(139,92,246,0.15); background: rgba(139,92,246,0.02); }
.panel-right { flex: 1; display: flex; flex-direction: column; gap: 18px; background: #0f0e18; }
label { display: block; font-size: 0.78em; font-weight: bold; color: #a78bfa; margin-bottom: 4px; letter-spacing: 0.02em; }
input[type="text"], textarea {
    width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(139,92,246,0.25);
    background: #1a1826; color: #d4d0e9; font-family: inherit; font-size: 0.85em;
    line-height: 1.65; outline: none; transition: border 0.2s ease;
}
input[type="text"]:focus, textarea:focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139,92,246,0.1); }
textarea { min-height: 260px; resize: vertical; white-space: pre-wrap; }
.form-group { margin-bottom: 16px; }
.form-row { display: flex; gap: 10px; }
.form-row .form-group:first-child { flex: 0 0 70px; }
.form-row .form-group:last-child { flex: 1; }
.btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 20px; border-radius: 8px;
    border: none; cursor: pointer; font-size: 0.82em; font-weight: bold; font-family: inherit;
    transition: all 0.2s ease; letter-spacing: 0.02em;
}
.btn-primary { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff; width: 100%; justify-content: center; }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(139,92,246,0.35); }
.btn-outline { background: transparent; border: 1px solid rgba(139,92,246,0.4); color: #a78bfa; }
.btn-outline:hover { background: rgba(139,92,246,0.1); }
.btn-danger { background: transparent; border: 1px solid rgba(239,68,68,0.3); color: #f87171; font-size: 0.7em; padding: 4px 10px; }
.btn-danger:hover { background: rgba(239,68,68,0.1); }
.btn-sm { padding: 5px 12px; font-size: 0.72em; }
.section-title { font-size: 0.72em; font-weight: bold; color: #7c7491; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
.prompt-copybox {
    position: relative; max-width: 680px; margin: 0 auto;
    font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
}
.prompt-copybox .prompt-label {
    display: inline-block; background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff;
    font-size: 0.75em; font-weight: bold; padding: 4px 14px; border-radius: 8px 8px 0 0; letter-spacing: 0.05em;
}
.prompt-copybox .prompt-wrap {
    position: relative; border: 1px solid rgba(139,92,246,0.3); border-radius: 0 12px 12px 12px; overflow: hidden;
}
.prompt-copybox textarea.copy-area {
    display: block; width: 100%; min-height: 200px; max-height: 400px;
    background: #1e1b2e; color: #d4d0e9;
    font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    font-size: 0.88em; line-height: 1.8; padding: 50px 18px 18px;
    border: none; resize: vertical; outline: none; white-space: pre-wrap; word-wrap: break-word;
}
.prompt-copybox .copy-btn {
    position: absolute; top: 10px; right: 10px;
    background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff;
    border: none; padding: 6px 16px; border-radius: 6px; cursor: pointer;
    font-size: 0.8em; font-weight: bold; transition: all 0.25s ease; z-index: 5; font-family: inherit;
}
.prompt-copybox .copy-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(139,92,246,0.4); }
.prompt-copybox .copy-btn.copied { background: linear-gradient(135deg, #10b981, #059669); }
.prompt-copybox .prompt-note { margin-top: 8px; font-size: 0.75em; color: #888; text-align: right; }
.code-output {
    background: #0d0b14; border: 1px solid rgba(139,92,246,0.25); border-radius: 10px; overflow: hidden;
    max-height: 300px; overflow-y: auto;
}
.code-output pre {
    padding: 16px; font-size: 0.7em; line-height: 1.6; color: #a9a4bc; white-space: pre-wrap; word-break: break-all;
    font-family: 'SF Mono', 'Consolas', 'Menlo', monospace;
}
.code-output pre::-webkit-scrollbar, .code-output::-webkit-scrollbar { width: 5px; }
.code-output pre::-webkit-scrollbar-thumb, .code-output::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.3); border-radius: 3px; }
.saved-list { max-height: 200px; overflow-y: auto; }
.saved-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 10px; border-radius: 6px; background: rgba(139,92,246,0.04); margin-bottom: 4px;
    border: 1px solid rgba(139,92,246,0.1); transition: background 0.15s;
}
.saved-item:hover { background: rgba(139,92,246,0.08); }
.saved-item .saved-label { font-size: 0.78em; flex: 1; cursor: pointer; color: #c4b5fd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.saved-item .saved-label:hover { color: #ddd6fe; text-decoration: underline; }
.saved-item .btn-sm { flex-shrink: 0; }
.empty-state { font-size: 0.78em; color: #5c5470; text-align: center; padding: 20px; }
.toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 999;
    background: #10b981; color: #fff; padding: 10px 24px; border-radius: 8px; font-size: 0.82em;
    font-weight: bold; pointer-events: none; opacity: 0; transition: opacity 0.3s ease;
    box-shadow: 0 6px 24px rgba(16,185,129,0.35);
}
.toast.show { opacity: 1; }
@media (max-width: 820px) {
    .app { flex-direction: column; }
    .panel-left { max-width: none; border-right: none; border-bottom: 1px solid rgba(139,92,246,0.15); }
}
</style>
</head>
<body>

<header>
    <h1>はてなブログ用 お題コピペボックス ジェネレーター</h1>
    <p>お題本文を書くだけで、はてなブログに貼れるHTMLを自動生成します</p>
</header>

<div class="app">
    <div class="panel panel-left">
        <div class="section-title">お題の設定</div>
        <div class="form-row">
            <div class="form-group">
                <label>絵文字</label>
                <input type="text" id="emoji" value="" maxlength="4" placeholder="">
            </div>
            <div class="form-group">
                <label>ラベル名</label>
                <input type="text" id="labelName" value="Prompt" placeholder="例: バレンタインRP プロンプト">
            </div>
        </div>
        <div class="form-group">
            <label>お題本文</label>
            <textarea id="promptText" placeholder="ここにお題の本文を貼り付けてね..."></textarea>
        </div>
        <button class="btn btn-primary" id="btnGenerate">生成してプレビュー</button>

        <div style="margin-top: 28px;">
            <div class="section-title">保存済みのお題</div>
            <div class="saved-list" id="savedList">
                <div class="empty-state">まだ保存されたお題はありません</div>
            </div>
        </div>
    </div>

    <div class="panel panel-right">
        <div class="section-title">プレビュー（はてなブログ上での表示）</div>
        <div id="previewArea">
            <div class="empty-state" style="padding:40px;">左側でお題を入力して「生成してプレビュー」を押してください</div>
        </div>

        <div style="margin-top: 12px;" id="outputSection" hidden>
            <div class="section-title">完成HTML（はてなブログのHTML編集に貼り付け）</div>
            <div class="code-output">
                <pre id="outputCode"></pre>
            </div>
            <div style="display:flex; gap:8px; margin-top: 8px;">
                <button class="btn btn-outline btn-sm" id="btnCopyHTML">HTMLをコピー</button>
                <button class="btn btn-outline btn-sm" id="btnSave">このお題を保存</button>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
    var STORAGE_KEY = 'hatena_prompt_generator_items';

    function getItems() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { return []; }
    }
    function saveItems(items) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    var elEmoji = document.getElementById('emoji');
    var elLabel = document.getElementById('labelName');
    var elText  = document.getElementById('promptText');
    var elPreview = document.getElementById('previewArea');
    var elOutput  = document.getElementById('outputCode');
    var elOutputSection = document.getElementById('outputSection');
    var elSavedList = document.getElementById('savedList');
    var elToast = document.getElementById('toast');

    function showToast(msg) {
        elToast.textContent = msg;
        elToast.classList.add('show');
        clearTimeout(elToast._timeout);
        elToast._timeout = setTimeout(function(){ elToast.classList.remove('show'); }, 2000);
    }

    function escapeHTML(str) {
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function generateHTML(label, emoji, text) {
        var fullLabel = (emoji || '') + ' ' + (label || 'Prompt');
        return '<!-- はてなブログ用コピペボックス -->\n<style>\n.prompt-copybox{position:relative;max-width:680px;margin:2em auto;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif}\n.prompt-copybox .prompt-label{display:inline-block;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;font-size:.75em;font-weight:bold;padding:4px 14px;border-radius:8px 8px 0 0;letter-spacing:.05em}\n.prompt-copybox .prompt-wrap{position:relative;border:1px solid rgba(139,92,246,.3);border-radius:0 12px 12px 12px;overflow:hidden}\n.prompt-copybox textarea{display:block;width:100%;min-height:320px;background:#1e1b2e;color:#d4d0e9;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;font-size:.88em;line-height:1.8;padding:50px 18px 18px;border:none;resize:vertical;outline:none;white-space:pre-wrap;word-wrap:break-word}\n.prompt-copybox textarea::-webkit-scrollbar{width:6px}\n.prompt-copybox textarea::-webkit-scrollbar-track{background:rgba(255,255,255,.05)}\n.prompt-copybox textarea::-webkit-scrollbar-thumb{background:rgba(139,92,246,.4);border-radius:3px}\n.prompt-copybox .copy-btn{position:absolute;top:10px;right:10px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;border:none;padding:6px 16px;border-radius:6px;cursor:pointer;font-size:.8em;font-weight:bold;transition:all .25s ease;z-index:5;font-family:inherit}\n.prompt-copybox .copy-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(139,92,246,.4)}\n.prompt-copybox .copy-btn.copied{background:linear-gradient(135deg,#10b981,#059669)}\n.prompt-copybox .prompt-note{margin-top:8px;font-size:.75em;color:#888;text-align:right}\n</style>\n<div class="prompt-copybox"><span class="prompt-label">' + escapeHTML(fullLabel) + '</span><div class="prompt-wrap"><button class="copy-btn">コピー</button><textarea readonly rows="20">' + escapeHTML(text) + '</textarea></div><p class="prompt-note">ボタンを押すとクリップボードにコピーされます</p></div>\n<script>(function(){var b=document.querySelectorAll(".prompt-copybox");for(var i=0;i<b.length;i++){(function(b){var t=b.querySelector(".copy-btn"),a=b.querySelector("textarea");if(!t||!a)return;t.addEventListener("click",function(){a.select();a.setSelectionRange(0,a.value.length);var o=false;try{o=document.execCommand("copy")}catch(e){}if(!o&&navigator.clipboard){navigator.clipboard.writeText(a.value)}t.textContent="コピーしました！";t.classList.add("copied");setTimeout(function(){t.textContent="コピー";t.classList.remove("copied")},2000)})})(b[i])}})();<\/script>\n<!-- はてなブログ用コピペボックス -->';
    }

    function updatePreview(label, emoji, text) {
        var fullLabel = (emoji || '') + ' ' + (label || 'Prompt');
        var displayText = text || '';
        elPreview.innerHTML = '<div class="prompt-copybox">' +
            '<span class="prompt-label">' + escapeHTML(fullLabel) + '</span>' +
            '<div class="prompt-wrap">' +
            '<button class="copy-btn" onclick="return false;">コピー</button>' +
            '<textarea class="copy-area" readonly rows="12">' + escapeHTML(displayText) + '</textarea>' +
            '</div>' +
            '<p class="prompt-note">ボタンを押すとクリップボードにコピーされます</p>' +
            '</div>';
    }

    function generate() {
        var emoji = elEmoji.value.trim();
        var label = elLabel.value.trim();
        var text  = elText.value;
        if (!text.trim()) { showToast('お題本文を入力してください'); return; }
        updatePreview(label, emoji, text);
        var html = generateHTML(label, emoji, text);
        elOutput.textContent = html;
        elOutputSection.hidden = false;
    }

    function copyOutput() {
        var code = elOutput.textContent;
        if (!code) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(code).then(function(){ showToast('HTMLをコピーしました！ はてなブログに貼り付けてね'); });
            return;
        }
        var ta = document.createElement('textarea');
        ta.value = code; ta.style.position='fixed'; ta.style.left='-9999px';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch(e) {}
        document.body.removeChild(ta);
        showToast('HTMLをコピーしました！ はてなブログに貼り付けてね');
    }

    function saveCurrent() {
        var emoji = elEmoji.value.trim();
        var label = elLabel.value.trim();
        var text  = elText.value;
        if (!text.trim()) { showToast('お題本文を入力してください'); return; }
        var items = getItems();
        var id = Date.now().toString();
        items.push({ id: id, emoji: emoji, label: label, text: text, savedAt: new Date().toISOString() });
        saveItems(items);
        renderSavedList();
        showToast('保存しました！');
    }

    function loadItem(id) {
        var items = getItems();
        var item = items.find(function(it){ return it.id === id; });
        if (!item) return;
        elEmoji.value = item.emoji || '';
        elLabel.value = item.label || '';
        elText.value  = item.text || '';
        generate();
        showToast('読み込みました');
    }

    function deleteItem(id) {
        var items = getItems();
        items = items.filter(function(it){ return it.id !== id; });
        saveItems(items);
        renderSavedList();
        showToast('削除しました');
    }

    function renderSavedList() {
        var items = getItems();
        if (items.length === 0) {
            elSavedList.innerHTML = '<div class="empty-state">まだ保存されたお題はありません</div>';
            return;
        }
        var html = '';
        items.reverse().forEach(function(item){
            var displayLabel = (item.emoji || '') + ' ' + (item.label || '無題');
            html += '<div class="saved-item">' +
                '<span class="saved-label" data-id="' + item.id + '">' + escapeHTML(displayLabel) + '</span>' +
                '<button class="btn btn-danger btn-sm" data-delete="' + item.id + '">削除</button>' +
                '</div>';
        });
        elSavedList.innerHTML = html;
    }

    document.getElementById('btnGenerate').addEventListener('click', generate);
    document.getElementById('btnCopyHTML').addEventListener('click', copyOutput);
    document.getElementById('btnSave').addEventListener('click', saveCurrent);

    elSavedList.addEventListener('click', function(e){
        var target = e.target;
        if (target.hasAttribute('data-delete')) {
            if (confirm('このお題を削除しますか？')) deleteItem(target.getAttribute('data-delete'));
            return;
        }
        if (target.classList.contains('saved-label')) {
            loadItem(target.getAttribute('data-id'));
            return;
        }
    });

    renderSavedList();
})();
</script>
</body>
</html>
