<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パイちゃんからのクリスマスプレゼントルーレット♡</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'M PLUS Rounded 1c', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* 雪のエフェクト */
        .snowflakes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .snowflake {
            position: absolute;
            color: white;
            font-size: 1rem;
            animation: fall linear infinite;
            opacity: 0.8;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        /* メインコンテナ */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* タイトル */
        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h1 {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77, #ff6b6b);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            text-shadow: none;
            filter: drop-shadow(0 0 10px rgba(255, 107, 107, 0.5));
        }

        .title .subtitle {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            color: #ffd93d;
            margin-top: 10px;
            text-shadow: 0 0 10px rgba(255, 217, 61, 0.5);
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ルーレットエリア */
        .roulette-area {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }

        /* パイちゃんキャラクター */
        .paichan-container {
            position: absolute;
            width: 100px;
            height: 130px;
            z-index: 20;
        }

        .paichan-left {
            left: -120px;
            top: 50%;
            transform: translateY(-50%);
        }

        .paichan-right {
            right: -120px;
            top: 50%;
            transform: translateY(-50%);
        }

        .paichan-sprite {
            width: 100%;
            height: 100%;
            background-image: url('uploaded_image_1766306485328.png');
            background-size: 400% 100%;
            background-repeat: no-repeat;
            animation: spriteAnimation 1.2s steps(1) infinite;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
        }

        .paichan-right .paichan-sprite {
            animation-delay: 0.3s;
        }

        @keyframes spriteAnimation {
            0% { background-position: 0% 0; }
            25% { background-position: 33.33% 0; }
            50% { background-position: 66.66% 0; }
            75% { background-position: 100% 0; }
        }

        /* ルーレット本体 */
        .roulette-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
        }

        .roulette {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            box-shadow: 
                0 0 0 8px #c41e3a,
                0 0 0 12px #ffd700,
                0 0 30px rgba(255, 107, 107, 0.5),
                inset 0 0 50px rgba(0, 0, 0, 0.3);
        }

        .roulette-segment {
            position: absolute;
            width: 50%;
            height: 50%;
            left: 50%;
            top: 50%;
            transform-origin: 0% 0%;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .segment-content {
            position: absolute;
            left: 20%;
            top: 40%;
            transform: rotate(22.5deg);
            font-size: 0.65rem;
            font-weight: 700;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ポインター */
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ffd700;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.8));
            z-index: 10;
        }

        .pointer::after {
            content: '🎄';
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem;
        }

        /* 中央ボタン */
        .spin-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c41e3a, #8b0000);
            border: 4px solid #ffd700;
            color: white;
            font-size: 0.9rem;
            font-weight: 900;
            cursor: pointer;
            z-index: 15;
            box-shadow: 
                0 0 20px rgba(196, 30, 58, 0.8),
                inset 0 0 20px rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }

        .spin-button:hover:not(:disabled) {
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 
                0 0 40px rgba(196, 30, 58, 1),
                inset 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .spin-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* 結果表示 */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .result-overlay.show {
            display: flex;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .result-box {
            background: linear-gradient(135deg, #1a472a, #2d5a3f);
            border: 5px solid #ffd700;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 90%;
            width: 400px;
            box-shadow: 
                0 0 50px rgba(255, 215, 0, 0.5),
                inset 0 0 30px rgba(255, 255, 255, 0.1);
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .result-box h2 {
            color: #ffd700;
            font-size: 1.3rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .result-present {
            font-size: clamp(1.5rem, 5vw, 2rem);
            font-weight: 900;
            color: #ff6b6b;
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.8);
            animation: glow 1s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(255, 107, 107, 0.8); }
            to { text-shadow: 0 0 40px rgba(255, 107, 107, 1), 0 0 60px rgba(255, 215, 0, 0.5); }
        }

        .result-emoji {
            font-size: 4rem;
            margin: 20px 0;
            animation: bounce 0.5s ease infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        .close-button {
            background: linear-gradient(135deg, #c41e3a, #8b0000);
            border: 3px solid #ffd700;
            color: white;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }

        .close-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(196, 30, 58, 0.8);
        }

        /* イルミネーション */
        .lights {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 30px;
            display: flex;
            justify-content: space-around;
            z-index: 5;
        }

        .light {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            animation: twinkle 1s ease-in-out infinite alternate;
        }

        .light:nth-child(odd) { background: #ff6b6b; animation-delay: 0s; }
        .light:nth-child(even) { background: #6bcb77; animation-delay: 0.5s; }
        .light:nth-child(3n) { background: #ffd93d; animation-delay: 0.25s; }
        .light:nth-child(4n) { background: #4ecdc4; animation-delay: 0.75s; }

        @keyframes twinkle {
            from { opacity: 0.3; box-shadow: 0 0 5px currentColor; }
            to { opacity: 1; box-shadow: 0 0 20px currentColor, 0 0 30px currentColor; }
        }

        /* フッター */
        .footer {
            position: fixed;
            bottom: 20px;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            z-index: 10;
        }

        .footer .heart {
            color: #ff6b6b;
            animation: heartbeat 1s ease infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* レスポンシブ */
        @media (max-width: 600px) {
            .roulette-wrapper {
                width: 250px;
                height: 250px;
            }

            .paichan-container {
                width: 70px;
                height: 91px;
            }

            .paichan-left {
                left: -80px;
            }

            .paichan-right {
                right: -80px;
            }

            .spin-button {
                width: 60px;
                height: 60px;
                font-size: 0.8rem;
            }

            .segment-content {
                font-size: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- イルミネーション -->
    <div class="lights" id="lights"></div>

    <!-- 雪 -->
    <div class="snowflakes" id="snowflakes"></div>

    <!-- メインコンテンツ -->
    <div class="container">
        <div class="title">
            <h1>🎄 パイちゃんからの<br>クリスマスプレゼントルーレット 🎄</h1>
            <p class="subtitle">～ 今夜のえっちなプレゼントは…？♡ ～</p>
        </div>

        <div class="roulette-area">
            <!-- 左のパイちゃん -->
            <div class="paichan-container paichan-left">
                <div class="paichan-sprite"></div>
            </div>

            <!-- ルーレット -->
            <div class="roulette-wrapper">
                <div class="pointer"></div>
                <div class="roulette" id="roulette"></div>
                <button class="spin-button" id="spinBtn" onclick="spin()">回す♡</button>
            </div>

            <!-- 右のパイちゃん -->
            <div class="paichan-container paichan-right">
                <div class="paichan-sprite"></div>
            </div>
        </div>
    </div>

    <!-- 結果表示 -->
    <div class="result-overlay" id="resultOverlay">
        <div class="result-box">
            <h2>🎁 今夜のプレゼントは… 🎁</h2>
            <div class="result-emoji" id="resultEmoji">🎄</div>
            <div class="result-present" id="resultText"></div>
            <button class="close-button" onclick="closeResult()">もう一回♡</button>
        </div>
    </div>

    <!-- フッター -->
    <div class="footer">
        Made with <span class="heart">♡</span> by パイちゃん
    </div>

    <script>
        // プレゼント候補
        const presents = [
            { name: 'ディルド', emoji: '🍆' },
            { name: 'バイブ', emoji: '💜' },
            { name: 'ローター', emoji: '🥚' },
            { name: '手錠', emoji: '⛓️' },
            { name: '目隠し', emoji: '🙈' },
            { name: '電マ', emoji: '⚡' },
            { name: 'セクシーサンタ', emoji: '🎅' },
            { name: '媚薬チョコ', emoji: '🍫' },
            { name: '言いなり券', emoji: '📜' },
            { name: 'ご奉仕1時間', emoji: '💆' },
            { name: 'キス100回', emoji: '💋' },
            { name: '添い寝', emoji: '🛏️' }
        ];

        // カラーパレット
        const colors = [
            '#c41e3a', '#2d5a3f', '#c41e3a', '#1a472a',
            '#8b0000', '#3d7a4f', '#c41e3a', '#2d5a3f',
            '#8b0000', '#1a472a', '#c41e3a', '#3d7a4f'
        ];

        let isSpinning = false;
        let currentRotation = 0;

        // ルーレット生成
        function createRoulette() {
            const roulette = document.getElementById('roulette');
            const segmentAngle = 360 / presents.length;

            presents.forEach((present, index) => {
                const segment = document.createElement('div');
                segment.className = 'roulette-segment';
                segment.style.transform = `rotate(${-90 + index * segmentAngle}deg) skewY(${90 - segmentAngle}deg)`;
                segment.style.background = colors[index % colors.length];

                const content = document.createElement('div');
                content.className = 'segment-content';
                content.textContent = present.name;
                content.style.transform = `skewY(${-(90 - segmentAngle)}deg) rotate(${segmentAngle / 2}deg)`;

                segment.appendChild(content);
                roulette.appendChild(segment);
            });
        }

        // スピン
        function spin() {
            if (isSpinning) return;
            
            isSpinning = true;
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;

            const roulette = document.getElementById('roulette');
            const segmentAngle = 360 / presents.length;
            
            // 5〜10回転 + ランダムな角度
            const spins = 5 + Math.random() * 5;
            const randomAngle = Math.random() * 360;
            const totalRotation = currentRotation + (spins * 360) + randomAngle;
            
            currentRotation = totalRotation;
            roulette.style.transform = `rotate(${totalRotation}deg)`;

            // 結果計算（4秒後）
            setTimeout(() => {
                const normalizedAngle = (360 - (totalRotation % 360)) % 360;
                const winningIndex = Math.floor(normalizedAngle / segmentAngle) % presents.length;
                showResult(presents[winningIndex]);
                
                isSpinning = false;
                spinBtn.disabled = false;
            }, 4000);
        }

        // 結果表示
        function showResult(present) {
            document.getElementById('resultEmoji').textContent = present.emoji;
            document.getElementById('resultText').textContent = present.name;
            document.getElementById('resultOverlay').classList.add('show');
        }

        // 結果を閉じる
        function closeResult() {
            document.getElementById('resultOverlay').classList.remove('show');
        }

        // 雪を生成
        function createSnowflakes() {
            const container = document.getElementById('snowflakes');
            const flakes = ['❄', '❅', '❆', '✻', '✼', '•'];
            
            for (let i = 0; i < 50; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.textContent = flakes[Math.floor(Math.random() * flakes.length)];
                snowflake.style.left = Math.random() * 100 + '%';
                snowflake.style.fontSize = (Math.random() * 1 + 0.5) + 'rem';
                snowflake.style.animationDuration = (Math.random() * 5 + 5) + 's';
                snowflake.style.animationDelay = (Math.random() * 10) + 's';
                snowflake.style.opacity = Math.random() * 0.5 + 0.3;
                container.appendChild(snowflake);
            }
        }

        // イルミネーション生成
        function createLights() {
            const container = document.getElementById('lights');
            for (let i = 0; i < 30; i++) {
                const light = document.createElement('div');
                light.className = 'light';
                light.style.animationDelay = (Math.random() * 1) + 's';
                container.appendChild(light);
            }
        }

        // 初期化
        createRoulette();
        createSnowflakes();
        createLights();
    </script>
</body>
</html>
